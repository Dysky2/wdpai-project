# Production (docker-compose.prod.yaml): TLS only. The container listens on 443 and the host
# publishes it on ${APP_PORT}. There is no port 80, so no HTTP->HTTPS redirect server block.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Kept up to date by docker/nginx/entrypoint.prod.sh: the Let's Encrypt certificate from the
    # `certs` volume, or a temporary self-signed one until the first certificate is issued.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A plain-HTTP request sent to this TLS port: redirect to https on the same host:port.
    error_page 497 =301 https://$http_host$request_uri;

    root /app/public;
    index index.php index.html;

    client_max_body_size 6m;
    server_tokens off;

    # Inherited by every location below that has no add_header of its own (incl. the FastCGI one).
    include /etc/nginx/snippets/security-headers.conf;
    # Moderate max-age, no includeSubDomains/preload: a free DuckDNS subdomain may change.
    add_header Strict-Transport-Security "max-age=604800" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Evidence is never served statically: every /uploads/ request goes to the Front Controller,
    # which checks the session and case ownership (EvidenceController) and answers 401/403/404,
    # or 200 with X-Accel-Redirect into the internal location below. PHP files are never executed here.
    location ^~ /uploads/ {
        location ~* \.php$ {
            return 404;
        }

        rewrite ^ /index.php last;
    }

    # Reachable only through X-Accel-Redirect from PHP; a direct request gets 404.
    # /app/public/uploads is the `uploads` volume shared (read-only here) with the php service.
    location ^~ /_protected/uploads/ {
        internal;
        alias /app/public/uploads/;
        types { image/png png; image/jpeg jpg; }
        default_type application/octet-stream;
    }

    # The Front Controller is the only script handed to PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    # Any other *.php (including the *.html.php view templates) is never executed or exposed.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
