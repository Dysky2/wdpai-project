# Security headers sent with every response (pages, API, static files, uploads, error pages).
# Included at server level and again in every location that declares its own add_header,
# because nginx does not inherit add_header into a location that has any add_header of its own.

add_header X-Content-Type-Options "nosniff" always;
# DENY: the app never frames its own pages, so SAMEORIGIN is not needed (mirrors frame-ancestors 'none').
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# script-src hashes = the inline anti-FOUC theme script in public/views/layout.html.php
# (first hash: LF line endings, second: CRLF, i.e. a Windows checkout with core.autocrlf=true).
# Any change to that script requires recomputing both hashes, otherwise the theme falls back to CSS defaults.
# The <script type="application/json" id="i18n-data"> block is a data block, not executed, so CSP does not apply to it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UXdIbhrxQOIn479ulOScdZOT2zDkBm2q+/n/Zunk7cY=' 'sha256-uGl8DYu4vnLGeTRgy97x1JHgBM22+AFWVUP5nraKHVQ='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
