server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php index.html;

    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Evidence uploads are static files only: PHP is never executed here, whatever the extension.
    location ^~ /uploads/ {
        location ~* \.php$ {
            return 404;
        }

        try_files $uri =404;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    # The Front Controller is the only script handed to PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Any other *.php (including the *.html.php view templates) is never executed or exposed.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}