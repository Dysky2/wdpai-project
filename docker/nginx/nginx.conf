server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php index.html;

    client_max_body_size 6m;
    server_tokens off;

    # Inherited by every location below that has no add_header of its own (incl. the FastCGI one).
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Evidence uploads are static files only: PHP is never executed here, whatever the extension.
    location ^~ /uploads/ {
        location ~* \.php$ {
            return 404;
        }

        try_files $uri =404;
        default_type application/octet-stream;
        # Repeated on purpose: keep the full set here if this location ever gets its own add_header.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The Front Controller is the only script handed to PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Any other *.php (including the *.html.php view templates) is never executed or exposed.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
