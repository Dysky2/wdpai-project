# Rendered by the nginx image entrypoint (envsubst): ${HTTPS_PORT} is the port published on the host.

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /app/public;
    index index.php index.html;

    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Evidence uploads are static files only: PHP is never executed here, whatever the extension.
    location ^~ /uploads/ {
        location ~* \.php$ {
            return 404;
        }

        try_files $uri =404;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    # The Front Controller is the only script handed to PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
    }

    # Any other *.php (including the *.html.php view templates) is never executed or exposed.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
